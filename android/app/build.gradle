apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

import groovy.json.JsonSlurper

/**
 * VERSIONING — single source of truth is app.json (expo.version / expo.android.versionCode).
 * EAS environment variables (ANDROID_VERSION_NAME / ANDROID_VERSION_CODE) may override
 * per build without touching the repository. Defaults below keep local CLI builds identical
 * to previous behaviour.
 */
def appJson = new JsonSlurper().parseText(file('../../app.json').text)
def expoVersionName = appJson?.expo?.version ?: "2.0.1"
def expoVersionCode = appJson?.expo?.android?.versionCode ?: 7
def easVersionName = System.getenv("ANDROID_VERSION_NAME")
def easVersionCode = System.getenv("ANDROID_VERSION_CODE")

/**
 * SIGNING — credentials are NEVER stored in this repository.
 *
 * Resolution order for the release config:
 *   1. Standard AGP injected signing properties (`android.injected.signing.*`).
 *      These are what EAS Build, fastlane and Android Studio pass at invocation time,
 *      so cloud release builds are always signed with the EAS-managed keystore.
 *   2. `android/keystore.properties` — a local, git-ignored file for offline release
 *      builds (see keystore.properties.example).
 *   3. Nothing — if neither is present the release build fails loudly instead of
 *      silently falling back to a debug key (fail-safe, never fail-open).
 */
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("keystore.properties")
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

/**
 * This is the configuration block to customize your React Native Android app.
 * By default you don't need to apply any configuration, just uncomment the lines you need.
 */
react {
    /* Autolinking */
    autolinkLibrariesWithApp()
    //
    // Added by install-expo-modules
    entryFile = file(["node", "-e", "require('expo/scripts/resolveAppEntry')", rootDir.getAbsoluteFile().getParentFile().getAbsolutePath(), "android", "absolute"].execute(null, rootDir).text.trim())
    cliFile = new File(["node", "--print", "require.resolve('@expo/cli')"].execute(null, rootDir).text.trim())
    bundleCommand = "export:embed"
}

/**
 * Set this to true to Run Proguard on Release builds to minify the Java bytecode.
 */
def enableProguardInReleaseBuilds = false

/**
 * The preferred build flavor of JavaScriptCore (JSC)
 */
def jscFlavor = 'org.webkit:android-jsc:+'

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "com.citric_app"
    defaultConfig {
        applicationId "com.citric_app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode easVersionCode ? easVersionCode.toInteger() : expoVersionCode
        versionName easVersionName ? easVersionName : expoVersionName
    }
    signingConfigs {
        debug {
            storeFile file('debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
        release {
            if (project.hasProperty("android.injected.signing.store.file")) {
                storeFile file(project.property("android.injected.signing.store.file"))
                storePassword project.property("android.injected.signing.store.password")
                keyAlias project.property("android.injected.signing.key.alias")
                keyPassword project.property("android.injected.signing.key.password")
            } else if (keystoreProperties["storeFile"]) {
                storeFile file(keystoreProperties["storeFile"])
                storePassword keystoreProperties["storePassword"]
                keyAlias keystoreProperties["keyAlias"]
                keyPassword keystoreProperties["keyPassword"]
            }
        }
    }
    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }
        release {
            signingConfig signingConfigs.release

            // minifyEnabled enableProguardInReleaseBuilds
            // proguardFiles getDefaultProguardFile("proguard-android.txt"), "proguard-rules.pro"

            minifyEnabled true // Enable ProGuard or R8
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // The version of react-native is set by the React Native Gradle Plugin
    implementation("com.facebook.react:react-android")

    if (hermesEnabled.toBoolean()) {
        implementation("com.facebook.react:hermes-android")
    } else {
        implementation jscFlavor
    }
}
